<!DOCTYPE html>
<html lang="en">
        <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

    <body>
        <main class="app-card">
            <header class="page-header">
                <span class="eyebrow">A little progress, every day</span>
                <h1>My To-Do List</h1>
                <p>Write it down, make a plan, and take it one task at a time.</p>
            </header>
            <section class="composer" aria-label="Add tasks">
            <div>
                <form id="task-form" class="single-entry">
                    <label class="sr-only" for="task-input">New task</label> 
                    <input type="text" id="task-input" name="task-input" placeholder="What needs to get done?" required> 
                    <button class="button button-primary" type="submit">Add task</button>
                </form>
            </div>
            <br>
                <details>
                    <summary>Add several tasks at once</summary>
                    <div>
                        <form id="bulk-form" class="bulk-entry">
                            <label for="bulk-input">Enter one task per line</label>
                            <textarea id="bulk-input" name="tasks" rows="4" placeholder="Reply to emails&#10;Plan the week&#10;Water the plants" required></textarea>
                            <div class="bulk-actions">
                                <span class="helper-text">Blank lines are skipped.</span>
                                <button class="button button-secondary" type="submit">Add all tasks</button>
                            </div>
                        </form>
                    </div>
                </details>
            </section>
            <section class="list-section" aria-labelledby="list-heading">    
                <div class="list-heading-row">
                    <h2 id="list-heading">Your tasks</h2>
                    <span id="task-count" class="task-count" aria-live="polite" >0 tasks</span>
                    <span id="tasks-remaining-count" class="tasks-remaining-count" aria-live="polite" >0 tasks remaining</span>
                    <span id="tasks-completed-count" class="tasks-completed-count" aria-live="polite" >0 tasks completed</span>

                </div>
            <ul id="task-list" class="task-list" aria-label="To-do tasks"></ul>
            <p id="empty-state" class="empty-state">Your list is clear. Add a task to get started.</p>
            </section>
            <footer class="app-footer">
                <span>Small steps add up.</span>
                <span class="footer-dot" aria-hidden="true"></span>
            </footer> 
        </main>  
    </body>
    
</html>
